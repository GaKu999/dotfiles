# vim:ft=confini:
# man:foot.ini(5)
# file:$XDG_CONFIG_HOME/foot/foot.ini
#==============================================================================#


font=monospace:size=10

include=~/.config/foot/themes/default.ini

[bell]
system=no
notify=yes

[scrollback]
lines=10000
indicator-position=fixed
indicator-format=line

[url]
osc8-underline=always

[cursor]
blink=yes
style=beam
unfocused-style=hollow

[csd]
preferred=none

[key-bindings]
show-urls-launch=none
show-urls-copy=Control+Shift+o

[tweak]
font-monospace-warn=no


#==============================================================================#
#                                 END OF FILE                                  #
#==============================================================================#
