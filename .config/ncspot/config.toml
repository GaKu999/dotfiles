# vim:ft=toml:
# man:ncspot(1)
# file:$XDG_CONFIG_HOME/ncspot/config.toml
#==============================================================================#


# command_key = ":"

# initial_screen = "library"

use_nerdfont = true

# flip_status_indicators = false

backend = "pulseaudio"
# backend_device = ""

# audio_cache = true
audio_cache_size = 1024

volnorm = true
#volnorm_pregain = 0.0

default_keybindings = true

notify = true

# bitrate = 320

# gapless = true

shuffle = true

# repeat = "off"

# playback_state = "Paused"

library_tabs = [ "artists", "podcasts", "browse" ]

# cover_max_scale = 1.0

hide_display_names = true

statusbar_format = "%artists - %title"

[theme]
background = "default"
primary = "default"
secondary = "light black"
title = "light magenta"
playing = "light green"
playing_selected = "light green"
playing_bg = "black"
highlight = "light red"
highlight_bg = "black"
error = "light red"
error_bg = "black"
statusbar = "light magenta"
statusbar_progress = "light cyan"
statusbar_bg = "black"
cmdline = "default"
cmdline_bg = "default"
search_match = "light red"

[track_format]
left = "%artists - %title"
center = "%album"
right = "%saved %duration"

[notification_format]
title = "Spotify: Now Playing"
body = "%artists - %title"


#==============================================================================#
#                                 END OF FILE                                  #
#==============================================================================#
